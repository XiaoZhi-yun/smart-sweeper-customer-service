# Chroma 向量数据库配置
# Chroma 是一个轻量级的嵌入式向量数据库，负责存储和检索文档向量

# 集合名称：向量库中存储文档的集合名
collection_name: agent

# 持久化目录：向量数据在本地的存储路径
persist_directory: chroma_db

# 检索返回条数：用户提问时，从向量库中找到的最相似文档数量
k: 3

# 知识库文档目录：存放待向量化的原始文档
data_path: data

# MD5 去重记录文件：记录已加载文档的 MD5，避免重复向量化
md5_hex_store: md5.text

# 支持的知识库文件类型：只有这些后缀的文件会被自动加载
allow_knowledge_file_type: ["txt", "pdf"]

# 文本分片配置：决定文档如何被切分
chunk_size: 200       # 每个分片的最大字符数
chunk_overlap: 20     # 相邻分片的重叠字符数，防止语义截断
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]  # 切分优先级：段落→行→标点→空格